    <script>

    <style>
        body { font-family: 'Cairo', sans-serif; background:#faf5e9; color:#2b2118; }
        .text-reading { display: block; white-space: normal; font-family: 'Amiri', serif; line-height: 1.6; margin-bottom: 1.25rem; word-break: normal; overflow-wrap: break-word; text-align: justify; text-justify: inter-word; text-justify: distribute; text-align-last: justify; direction: rtl; }

        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(169,121,47,.5); border-radius: 4px; }

        html[data-theme="dark"] .bg-white { background:#1e1912; }
        html[data-theme="dark"] .border-slate-200 { border-color:#3a3225; }
        html[data-theme="dark"] .text-slate-900 { color:#ece4d3; }
        html[data-theme="dark"] .text-slate-600 { color:#d9b977; }

        html[data-theme="dark"] .hover\:bg-slate-50:hover { background:#241f16; }
        html[data-theme="dark"] .hover\:bg-slate-100:hover { background:#241f16; }
        html[data-theme="dark"] .bg-amber-50 { background:#1c2b23; }
        html[data-theme="dark"] .text-amber-900 { color:#d9b977; }
        html[data-theme="dark"] .border-amber-200 { border-color:#4e9a73; }
            html[data-theme="dark"] mark{background:#4e9a73;color:#1e1912;border-radius:3px;padding:0 2px}
</style>
    <script>
        (function(){var t=localStorage.getItem('ik_theme')||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.setAttribute('data-theme',t);})();
    </script>
</head>
<body class="min-h-screen flex flex-col">
    <header class="bg-green text-headertext py-4 px-4 md:px-6 lg:px-8 shadow-md sticky top-0 z-30 w-full">
        <div class="w-full px-4 md:px-6 lg:px-8 flex items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <button id="sidebarToggle" class="lg:hidden p-2 rounded-lg bg-white/15 border border-white/35 hover:bg-white/25" aria-label="القائمة">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <div>
                    <h1 class="text-lg md:text-xl font-bold font-amiri">📜 تاريخ ابن خلدون</h1>
                    <p class="text-xs md:text-sm opacity-90 mt-0.5">ديوان المبتدأ والخبر في تاريخ العرب والبربر ومن عاصرهم من ذوي السلطان الأكبر</p>
                </div>
            </div>
            <button id="themeToggle" class="p-2 rounded-lg bg-white/15 border border-white/35 hover:bg-white/25 text-lg" aria-label="تبديل الوضع">🌙</button>
        </div>
    </header>

    <div class="w-full flex-1 flex px-0 md:px-0 lg:px-0 py-6 gap-6 relative">
        <div id="sidebarBackdrop" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden"></div>
        <aside id="sidebar" class="fixed lg:static inset-y-0 right-0 w-[85%] max-w-[340px] bg-white border border-slate-200 rounded-2xl p-4 flex flex-col z-40 transform translate-x-full lg:translate-x-0 transition-transform duration-300 shadow-lg lg:shadow-none h-[calc(100vh-6rem)] lg:h-auto">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-3">
                <h2 class="font-bold text-base">فهرس الكتاب</h2>
                <button id="sidebarClose" class="lg:hidden p-1 rounded-md text-slate-400 hover:text-slate-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="mb-3 relative">
                <input type="text" id="searchInput" placeholder="بحث في الفصول والمحتوى..." class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500">
                <div id="searchStats" class="text-xs text-slate-500 px-1 mt-1.5"></div>
                <div id="quickJumpResults" class="mt-2 max-h-56 overflow-y-auto bg-white border border-slate-200 rounded-xl shadow-md hidden z-20 p-1 absolute left-0 right-0"></div>
            </div>
                        <div class="flex gap-2 mb-2">
                <button id="scrollUp" class="flex-1 px-2 py-1.5 text-xs bg-slate-100 rounded-lg hover:bg-slate-200">▲ أعلى</button>
                <button id="scrollDown" class="flex-1 px-2 py-1.5 text-xs bg-slate-100 rounded-lg hover:bg-slate-200">▼ أسفل</button>
            </div>
            <nav id="chapterList" class="flex-1 overflow-y-auto space-y-1 pr-1"></nav>
        </aside>

        <main class="flex-1 bg-white border border-slate-200 rounded-2xl p-6 md:p-8 lg:p-10 shadow-sm flex flex-col min-h-[70vh]">
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center gap-2">
                    <button id="prevBtn" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-sm font-semibold rounded-xl disabled:opacity-40">← السابق</button>
                    <button id="nextBtn" class="px-3 py-2 bg-gold hover:opacity-90 text-white text-sm font-semibold rounded-xl disabled:opacity-40">التالي →</button>
                </div>
                <div class="flex items-center bg-slate-100 rounded-lg p-1 border border-slate-200">
                    <button id="fontDecrease" class="px-2 py-1 text-xs font-bold rounded hover:bg-white">A-</button>
                    <span id="fontSizeIndicator" class="px-2 text-xs">18px</span>
                    <button id="fontIncrease" class="px-2 py-1 text-xs font-bold rounded hover:bg-white">A+</button>
                </div>
            </div>
            <div id="chapterContent" class="flex-1"></div>
            <div class="pt-6 mt-8 border-t border-slate-100 text-xs text-slate-400 text-center">تاريخ ابن خلدون — ديوان المبتدأ والخبر</div>
        </main>
    </div>

    <footer class="py-4 text-center text-xs text-slate-400 border-t border-slate-200 bg-white mt-4">OpenITI (Shamela_0012320) · v1.2.0</footer>

    <script>
    (function(){
      "use strict";
      var SW_CACHE='tarikh-data-v1.3.0';
      var READ=[];
      var idx=0;
      var allLoaded=false;
      var fs=18;
      var content=document.getElementById('chapterContent');
      var list=document.getElementById('chapterList');
      var q=document.getElementById('searchInput');
      var prev=document.getElementById('prevBtn');
      var next=document.getElementById('nextBtn');
      var fdec=document.getElementById('fontDecrease');
      var finc=document.getElementById('fontIncrease');
      var find=document.getElementById('fontSizeIndicator');
      var side=document.getElementById('sidebar');
      var sb=document.getElementById('sidebarBackdrop');
      var st=document.getElementById('sidebarToggle');
      var sc=document.getElementById('sidebarClose');
      var tt=document.getElementById('themeToggle');
      var statsEl=document.getElementById('searchStats');
      var jumpEl=document.getElementById('quickJumpResults');
      var activeKeyboardIndex=-1, debounceTimer=null;
      function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
      function reEsc(s){return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
      function terms(qs){qs=String(qs||'').trim();if(!qs)return[];return qs.split(/\s+/).filter(Boolean);}
      function nodeLC(n){if(n._lc==null){n._lc=((n.title||'')+' '+(n.paragraphs||[]).join(' ')).toLowerCase();}return n._lc;}
      function doSearch(qs){
        var ts=terms(qs).map(function(t){return t.toLowerCase();});
        if(!ts.length)return null;
        var matches=[],total=0;
        for(var i=0;i<READ.length;i++){
          var n=READ[i];
          var title=(n.title||'').toLowerCase();
          var body=nodeLC(n);
          var c=0;
          for(var k=0;k<ts.length;k++){
            var t=ts[k],p=0,ix;
            while((ix=body.indexOf(t,p))>=0){c++;p=ix+t.length;}
          }
          var tmatch=ts.every(function(t){return title.indexOf(t)>=0;});
          if(c>0||tmatch){matches.push({n:n,c:c});total+=c;}
        }
        return {matches:matches,total:total,chapters:matches.length};
      }
      function updateStats(qs){
        if(!statsEl)return;
        if(!terms(qs).length){statsEl.innerHTML='';return;}
        var r=doSearch(qs);
        if(r&&r.total>0){statsEl.innerHTML='تم العثور على <strong class="text-amber-700">'+r.total+'</strong> نتيجة في <strong class="text-amber-700">'+r.chapters+'</strong> فصل';}
        else{statsEl.innerHTML='<span class="text-red-500 font-medium">لا توجد نتائج مطابقة</span>';}
      }
      function updateJump(qs){
        if(!jumpEl)return;
        activeKeyboardIndex=-1;
        if(!terms(qs).length){jumpEl.innerHTML='';jumpEl.classList.add('hidden');return;}
        var r=doSearch(qs);
        if(!r||!r.matches.length){jumpEl.innerHTML='<div class="px-3 py-2 text-xs text-slate-400 text-center">لا توجد نتائج مطابقة</div>';jumpEl.classList.remove('hidden');return;}
        var cap=r.matches.slice(0,50),h='';
        for(var i=0;i<cap.length;i++){
          var m=cap[i];
          var badge=m.c>0?'<span class="text-[10px] text-amber-700 bg-amber-50 px-1.5 py-0.5 rounded shrink-0 mr-2">'+m.c+'</span>':'';
          h+='<button type="button" data-i="'+i+'" class="jump-item w-full text-right px-3 py-2 text-xs hover:bg-amber-50 rounded-lg transition border-b border-slate-100 flex items-center justify-between"><span class="font-semibold text-slate-700 truncate">'+esc(m.n.title)+'</span>'+badge+'</button>';
        }
        jumpEl.innerHTML=h;
        jumpEl.classList.remove('hidden');
        var items=jumpEl.querySelectorAll('.jump-item');
        for(var j=0;j<items.length;j++){
          (function(item,node){item.addEventListener('click',function(){jumpTo(READ.indexOf(node));});})(items[j],cap[j].n);
        }
      }
      function jumpTo(i){if(i<0)return;idx=i;render(false);if(jumpEl)jumpEl.classList.add('hidden');if(window.innerWidth<1024)toggleSide(false);}
      function updateKeyboardSelection(items){
        for(var i=0;i<items.length;i++){
          if(i===activeKeyboardIndex){items[i].classList.add('bg-amber-100','text-amber-900');items[i].classList.remove('hover:bg-amber-50');items[i].scrollIntoView({block:'nearest'});}
          else{items[i].classList.remove('bg-amber-100','text-amber-900');items[i].classList.add('hover:bg-amber-50');}
        }
      }
      function highlightSearchTerm(root,qs){
        var ts=terms(qs);
        if(!ts.length)return;
        var re=new RegExp('('+ts.map(reEsc).join('|')+')','gi');
        var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null,false);
        var nodes=[],n;
        while((n=walker.nextNode()))nodes.push(n);
        var low=ts.map(function(t){return t.toLowerCase();});
        nodes.forEach(function(tn){
          var txt=tn.nodeValue;
          if(!txt)return;
          re.lastIndex=0;
          if(!re.test(txt))return;
          re.lastIndex=0;
          var parts=txt.split(re);
          var frag=document.createDocumentFragment();
          parts.forEach(function(part){
            if(!part)return;
            var isMatch=low.indexOf(part.toLowerCase())>=0;
            if(isMatch){var span=document.createElement('span');span.className='bg-green-200 text-green-900 px-1 rounded font-semibold';span.textContent=part;frag.appendChild(span);}
            else{frag.appendChild(document.createTextNode(part));}
          });
          tn.parentNode.replaceChild(frag,tn);
        });
      }
      function toggleSide(o){if(o){side.classList.remove('translate-x-full');sb.classList.remove('hidden');}else{side.classList.add('translate-x-full');sb.classList.add('hidden');}}
      st.onclick=function(){toggleSide(true);}; sc.onclick=function(){toggleSide(false);}; sb.onclick=function(){toggleSide(false);};
      function listItem(n){
        var b=document.createElement('button');
        var act=READ.indexOf(n)===idx?'bg-amber-50 text-amber-900 border border-amber-200':'text-slate-600 hover:bg-slate-50';
        b.className='w-full text-right px-3 py-2 rounded-xl text-sm '+act;
        b.textContent=(READ.indexOf(n)+1)+'. '+(n.title||'...');
        b.onclick=function(){idx=READ.indexOf(n);render(true);if(window.innerWidth<1024)toggleSide(false);};
        return b;
      }
      function renderList(f){
        list.innerHTML='';
        var items=READ;
        if(terms(f).length){var r=doSearch(f);items=r?r.matches.map(function(m){return m.n;}):[];}
        if(!items.length){list.innerHTML='<div class="px-3 py-2 text-xs text-slate-400">لا نتائج</div>';return;}
        var frag=document.createDocumentFragment();
        for(var i=0;i<items.length;i++)frag.appendChild(listItem(items[i]));
        list.appendChild(frag);
      }
      function renderContent(){
        if(!READ.length){content.innerHTML='<div class="text-center text-slate-400 p-8">جارٍ تحميل الكتاب…</div>';return;}
        var n=READ[idx];
        var ps=n.paragraphs||[];
        var h='<h2 class="text-2xl sm:text-3xl font-bold font-amiri mb-6 pb-3 border-b border-slate-100">'+esc(n.title)+'</h2>';
        for(var i=0;i<ps.length;i++){h+='<p class="text-reading">'+esc(ps[i])+'</p>';}
        content.innerHTML=h;
        highlightSearchTerm(content,q.value);
        var els=content.querySelectorAll('.text-reading');
        for(var j=0;j<els.length;j++)els[j].style.fontSize=fs+'px';
        find.textContent=fs+'px';
      }
      function render(scroll){
        if(!READ.length){renderContent();return;}
        renderContent();
        prev.disabled=idx===0; next.disabled=idx===READ.length-1;
        renderList(q.value);
        if(scroll!==false)window.scrollTo({top:0,behavior:'smooth'});
      }
      fdec.onclick=function(){if(fs>14){fs-=2;renderContent();}};
      finc.onclick=function(){if(fs<28){fs+=2;renderContent();}};
      q.oninput=function(){
        clearTimeout(debounceTimer);
        debounceTimer=setTimeout(function(){
          var v=q.value;
          renderContent();
          renderList(v);
          updateStats(v);
          updateJump(v);
        },150);
      };
      q.addEventListener('keydown',function(e){
        if(!jumpEl||jumpEl.classList.contains('hidden'))return;
        var items=jumpEl.querySelectorAll('.jump-item');
        if(!items.length)return;
        if(e.key==='ArrowDown'){e.preventDefault();activeKeyboardIndex=(activeKeyboardIndex+1)%items.length;updateKeyboardSelection(items);}
        else if(e.key==='ArrowUp'){e.preventDefault();activeKeyboardIndex=(activeKeyboardIndex-1+items.length)%items.length;updateKeyboardSelection(items);}
        else if(e.key==='Enter'){e.preventDefault();if(activeKeyboardIndex>=0&&activeKeyboardIndex<items.length)items[activeKeyboardIndex].click();else items[0].click();}
        else if(e.key==='Escape'){jumpEl.classList.add('hidden');}
      });
      prev.onclick=function(){if(idx>0){idx--;render(true);}};
      next.onclick=function(){if(idx<READ.length-1){idx++;render(true);}};
      tt.onclick=function(){
        var cur=document.documentElement.getAttribute('data-theme')||'dark';
        var nt=cur==='dark'?'light':'dark';
        document.documentElement.setAttribute('data-theme',nt);
        localStorage.setItem('ik_theme',nt);
        tt.textContent=nt==='dark'?'☀️':'🌙';
      };
      var su=document.getElementById('scrollUp');
      var sd=document.getElementById('scrollDown');
      if(su)su.onclick=function(){list.scrollTo({top:0,behavior:'smooth'});};
      if(sd)sd.onclick=function(){list.scrollTo({top:list.scrollHeight,behavior:'smooth'});};
      var curt=document.documentElement.getAttribute('data-theme')||'dark';
      tt.textContent=curt==='dark'?'☀️':'🌙';
      renderList('');
      content.innerHTML='<div class="text-center text-slate-400 p-8">جارٍ تحميل الكتاب…</div>';

      function appendSections(arr){for(var i=0;i<arr.length;i++)READ.push(arr[i]);}
      function cachePut(file,res){try{if(res&&res.ok&&'caches' in window){var cc=res.clone();caches.open(SW_CACHE).then(function(c){c.put(file,cc)['catch'](function(){});}).catch(function(){});}}catch(e){}}
      function getJSON(file){return fetch(file,{cache:'no-store'}).then(function(res){cachePut(file,res);return res.json();});}
      function refreshNav(){if(!READ.length)return;if(idx>READ.length-1)idx=READ.length-1;prev.disabled=idx===0;next.disabled=idx===READ.length-1;renderList(q.value);}
      function loadData(){
        getJSON('data/manifest.json').then(function(man){
          var chunks=(man&&man.chunks)||[];
          var results=new Array(chunks.length), next=0, cursor=0, active=0, MAX=6;
          function drain(){
            while(next<chunks.length && results[next]){
              var arr=results[next]; results[next]=null;
              var first=!READ.length;
              appendSections(arr);
              if(first)render(true); else refreshNav();
              next++;
            }
            if(next>=chunks.length){allLoaded=true;updateStats(q.value);}
          }
          function pump(){
            while(active<MAX && cursor<chunks.length){
              (function(k){
                active++;
                getJSON(chunks[k].file).then(function(arr){results[k]=arr||[];active--;drain();pump();}).catch(function(){results[k]=[];active--;drain();pump();});
              })(cursor++);
            }
          }
          pump();
        }).catch(function(){
          content.innerHTML='<div class="text-center text-red-500 p-8">تعذّر تحميل بيانات الكتاب. تحقّق من الاتصال بالإنترنت.</div>';
        });
      }
      loadData();
    })();
    </script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
</script>
